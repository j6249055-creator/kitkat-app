<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KitKat - Login & Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #870609;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #c41218 0%, #8b0509 70%, #5e0205 100%);
      padding: 30px 20px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0,0,0,0.5);
    }
    /* Silk waves decorative background elements */
    .silk-wave {
      position: absolute;
      top: -80px;
      left: -50px;
      width: 300px;
      height: 300px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
    }
    /* Brand Header */
    .brand-section {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      z-index: 5;
    }
    .brand-logo-img {
      max-width: 220px;
      height: auto;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.4));
      margin-bottom: 8px;
    }
    .brand-slogan {
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      font-style: italic;
    }
    /* White Card (Screenshot 2 Matching) */
    .auth-white-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 30px 24px 28px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      position: relative;
      z-index: 10;
    }
    /* Tabs: Login / Register */
    .auth-tabs {
      display: flex;
      justify-content: space-around;
      margin-bottom: 24px;
      border-bottom: 1.5px solid #f1f3f5;
      padding-bottom: 12px;
    }
    .auth-tab-btn {
      font-size: 17px;
      font-weight: 800;
      color: #4b5563;
      cursor: pointer;
      position: relative;
      background: none;
      border: none;
      padding-bottom: 8px;
    }
    .auth-tab-btn.active {
      color: #111827;
    }
    .auth-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -13.5px;
      left: 10%;
      right: 10%;
      height: 3.5px;
      background: #a30a0d;
      border-radius: 4px;
    }
    /* Input Fields (Screenshot 2 Matching) */
    .input-field-wrap {
      background: #fdf5f5;
      border: 1px solid #fee2e2;
      border-radius: 30px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .input-field-wrap:focus-within {
      background: #ffffff;
      border-color: #a30a0d;
      box-shadow: 0 0 0 3px rgba(163, 10, 13, 0.12);
    }
    .input-icon {
      color: #a30a0d;
      font-size: 19px;
      display: flex;
      align-items: center;
    }
    .country-code-lbl {
      font-size: 14.5px;
      font-weight: 800;
      color: #111;
      padding-right: 10px;
      border-right: 1.5px solid #d1d5db;
    }
    .input-field-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      color: #111827;
      font-weight: 600;
    }
    .input-field-wrap input::placeholder {
      color: #9ca3af;
      font-size: 13.5px;
      font-weight: 500;
    }
    .pwd-toggle-btn {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 19px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    /* Main Red Pill Button */
    .btn-auth-submit {
      width: 100%;
      background: linear-gradient(90deg, #c5161b 0%, #900508 100%);
      color: #ffffff;
      border: none;
      border-radius: 30px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      box-shadow: 0 6px 18px rgba(163, 10, 13, 0.4);
      transition: all 0.15s;
    }
    .btn-auth-submit:active {
      transform: scale(0.98);
    }
    /* Toggle Link at Bottom of Card */
    .auth-bottom-toggle {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #4b5563;
      font-weight: 600;
    }
    .auth-bottom-toggle a {
      color: #a30a0d;
      font-weight: 800;
      text-decoration: underline;
      cursor: pointer;
    }
    /* Bottom Sticker & Graphics */
    .bottom-break-time {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 20px;
    }
    .break-time-badge {
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.9;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    /* Toast */
    #toast-bar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="silk-wave"></div>

    <!-- Top Logo & Slogan -->
    <div class="brand-section">
      <img src="/img/kitkat_pack.jpg" alt="Nestle KitKat" class="brand-logo-img" style="border-radius:12px;max-height:90px;object-fit:cover;">
      <div class="brand-slogan">Have a break, have a KitKat®</div>
    </div>

    <!-- White Form Card -->
    <div class="auth-white-card">
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tabLoginBtn" onclick="setAuthMode('login')">Login</button>
        <button class="auth-tab-btn" id="tabRegisterBtn" onclick="setAuthMode('register')">Register</button>
      </div>

      <form id="authForm" onsubmit="event.preventDefault(); submitAuth();">
        <!-- Phone Number -->
        <div class="input-field-wrap">
          <iconify-icon class="input-icon" icon="solar:phone-calling-bold"></iconify-icon>
          <span class="country-code-lbl">+91</span>
          <input type="tel" id="authPhone" placeholder="Enter Phone Number" required maxlength="10">
        </div>

        <!-- Password -->
        <div class="input-field-wrap">
          <iconify-icon class="input-icon" icon="solar:lock-password-bold"></iconify-icon>
          <input type="password" id="authPassword" placeholder="Please enter password" required minlength="3">
          <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility('authPassword')">
            <iconify-icon icon="solar:eye-linear"></iconify-icon>
          </button>
        </div>

        <!-- Confirm Password (for Register mode) -->
        <div class="input-field-wrap" id="wrapConfirmPwd" style="display:none;">
          <iconify-icon class="input-icon" icon="solar:lock-password-bold"></iconify-icon>
          <input type="password" id="authConfirmPassword" placeholder="Please enter password again">
          <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility('authConfirmPassword')">
            <iconify-icon icon="solar:eye-linear"></iconify-icon>
          </button>
        </div>

        <!-- Referral Code (for Register mode) -->
        <div class="input-field-wrap" id="wrapRefCode" style="display:none;">
          <iconify-icon class="input-icon" icon="solar:users-group-two-rounded-bold"></iconify-icon>
          <input type="text" id="authRefCode" placeholder="Invitation Code (Optional)">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-submit" id="btnSubmitText">
          <iconify-icon icon="solar:user-plus-bold"></iconify-icon>
          <span>Login</span>
          <iconify-icon icon="solar:alt-arrow-right-linear"></iconify-icon>
        </button>

        <!-- Bottom Switcher -->
        <div class="auth-bottom-toggle" id="authBottomSwitcher">
          Don't have an account? <a onclick="setAuthMode('register')">Register</a>
        </div>
      </form>
    </div>

    <!-- 24/7 Support Link -->
    <div style="text-align:center;margin-top:16px;">
      <a href="https://t.me/KitKatPremiumSupport" target="_blank" style="color:#ffffff;font-size:12.5px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,0.25);padding:6px 14px;border-radius:20px;">
        <iconify-icon icon="solar:headphones-round-sound-bold"></iconify-icon> Need Help? 24/7 Support (@KitKatPremiumSupport)
      </a>
    </div>

    <!-- Break Time Branding at Bottom -->
    <div class="bottom-break-time">
      <div class="break-time-badge">Break Time 🍫</div>
      <div style="color:rgba(255,255,255,0.7);font-size:11px;font-weight:600;">
        Launch Date: 11 September 2026
      </div>
    </div>
  </div>

  <div id="toast-bar">Welcome to KitKat!</div>

  <script>
    let currentMode = 'login';

    // Auto-detect referral code from URL query ?ref=
    const urlParams = new URLSearchParams(window.location.search);
    const refParam = urlParams.get('ref');
    if (refParam) {
      document.getElementById('authRefCode').value = refParam;
      setAuthMode('register');
    }

    function setAuthMode(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById('tabLoginBtn');
      const tabRegister = document.getElementById('tabRegisterBtn');
      const wrapConfirm = document.getElementById('wrapConfirmPwd');
      const wrapRef = document.getElementById('wrapRefCode');
      const btnText = document.getElementById('btnSubmitText');
      const bottomSwitch = document.getElementById('authBottomSwitcher');

      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        wrapConfirm.style.display = 'none';
        wrapRef.style.display = 'none';
        btnText.innerHTML = `<iconify-icon icon="solar:user-bold"></iconify-icon> <span>Login</span> <iconify-icon icon="solar:alt-arrow-right-linear"></iconify-icon>`;
        bottomSwitch.innerHTML = `Don't have an account? <a onclick="setAuthMode('register')">Register</a>`;
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        wrapConfirm.style.display = 'flex';
        wrapRef.style.display = 'flex';
        btnText.innerHTML = `<iconify-icon icon="solar:user-plus-bold"></iconify-icon> <span>Register</span> <iconify-icon icon="solar:alt-arrow-right-linear"></iconify-icon>`;
        bottomSwitch.innerHTML = `Already have an account? <a onclick="setAuthMode('login')">Login</a>`;
      }
    }

    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      field.type = field.type === 'password' ? 'text' : 'password';
    }

    function showToast(msg) {
      const t = document.getElementById('toast-bar');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    async function submitAuth() {
      const phone = document.getElementById('authPhone').value.trim();
      const password = document.getElementById('authPassword').value.trim();

      if (!phone || phone.length < 10) {
        showToast('Please enter a valid 10-digit mobile number');
        return;
      }

      if (!password || password.length < 3) {
        showToast('Password must be at least 3 characters');
        return;
      }

      if (currentMode === 'register') {
        const confirmPass = document.getElementById('authConfirmPassword').value.trim();
        if (password !== confirmPass) {
          showToast('Passwords do not match. Please re-enter.');
          return;
        }

        const refCode = document.getElementById('authRefCode').value.trim();

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              phone: phone,
              password: password,
              ref_by: refCode || 'ADMIN'
            })
          });

          const data = await res.json();
          if (data.code === 200) {
            localStorage.setItem('kitkat_user', JSON.stringify(data.user));
            showToast('Account created successfully! Welcome to KitKat.');
            setTimeout(() => window.location.href = '/', 1000);
          } else {
            showToast(data.msg || 'Registration failed');
          }
        } catch (e) {
          showToast('Network error, please try again');
        }

      } else {
        // Login
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, password })
          });

          const data = await res.json();
          if (data.code === 200) {
            localStorage.setItem('kitkat_user', JSON.stringify(data.user));
            showToast('Login successful!');
            setTimeout(() => window.location.href = '/', 800);
          } else {
            showToast(data.msg || 'Login failed');
          }
        } catch (e) {
          showToast('Network error, please try again');
        }
      }
    }
  </script>
</body>
</html>
