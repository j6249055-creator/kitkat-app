<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KITKAT - Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page-container">
    <div class="auth-page">
      <div class="auth-brand-wrap">
        <img src="/img/kitkat_pack.jpg" alt="KitKat Logo" class="auth-logo-img">
        <h1 class="brand-title">KITKAT</h1>
        <p class="brand-tagline">Sign up to your account and get started</p>
        <div class="deco-line">
          <span></span>
          <div class="bar"></div>
          <span></span>
        </div>
      </div>

      <form id="registerForm" onsubmit="event.preventDefault(); handleRegister();">
        <div class="form-group">
          <label class="form-label" for="name">Good Name</label>
          <div class="input-box">
            <iconify-icon class="input-icon" icon="solar:user-bold-duotone"></iconify-icon>
            <input type="text" id="name" placeholder="Enter your name" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <div class="input-box">
            <iconify-icon class="input-icon" icon="solar:phone-bold-duotone"></iconify-icon>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-box">
            <iconify-icon class="input-icon" icon="solar:lock-password-bold-duotone"></iconify-icon>
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="button" class="toggle-pwd" onclick="togglePass('password')">
              <iconify-icon icon="mdi:eye-outline" width="20"></iconify-icon>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <div class="input-box">
            <iconify-icon class="input-icon" icon="solar:lock-keyhole-bold-duotone"></iconify-icon>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            <button type="button" class="toggle-pwd" onclick="togglePass('confirmPassword')">
              <iconify-icon icon="mdi:eye-outline" width="20"></iconify-icon>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="refCode">Invitation Code</label>
          <div class="input-box">
            <iconify-icon class="input-icon" icon="solar:tag-bold-duotone"></iconify-icon>
            <input type="text" id="refCode" placeholder="Invite code (e.g. kkat88)">
          </div>
        </div>

        <button type="submit" class="btn-full-red" id="registerBtn">Sign Up Now</button>

        <p class="auth-bottom-link">
          Already have an account? <a href="/login">Login Now</a>
        </p>
      </form>
    </div>
  </div>

  <div id="toast-alert"></div>

  <script>
    // Autofill referral code from URL query ?ref=xyz
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const ref = urlParams.get('ref');
      if (ref) {
        document.getElementById('refCode').value = ref;
      }
    });

    function showToast(msg) {
      const t = document.getElementById('toast-alert');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function togglePass(id) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    async function handleRegister() {
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();
      const refCode = document.getElementById('refCode').value.trim();
      const btn = document.getElementById('registerBtn');

      if (!name || !phone || !password || !confirmPassword) {
        showToast('Please fill in all required fields');
        return;
      }

      if (password !== confirmPassword) {
        showToast('Passwords do not match');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Creating account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            phone,
            password,
            w_password: confirmPassword,
            ref_by: refCode
          })
        });
        const data = await res.json();
        btn.disabled = false;
        btn.innerText = 'Sign Up Now';

        if (data.code === 200) {
          localStorage.setItem('kitkat_user', JSON.stringify(data.user));
          showToast('Account created successfully! Redirecting...');
          setTimeout(() => window.location.href = '/', 1200);
        } else {
          showToast(data.msg || 'Registration failed');
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerText = 'Sign Up Now';
        showToast('Network error, please try again.');
      }
    }
  </script>
</body>
</html>
